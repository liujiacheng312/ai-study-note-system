server:
  port: 8080

spring:
  application:
    name: ai-study-note-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_study_note?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    language: zh_cn

ainote:
  jwt:
    secret: "ai-study-note-system-jwt-secret-2026-please-change-in-prod"
    expire-minutes: 1440
  ai:
    mode: mock
    api-base-url: https://api.openai.com/v1
    api-key:
    model-name: gpt-4o-mini

logging:
  level:
    com.example.ainote: info
